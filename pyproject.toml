[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauge-vision"
version = "0.1.0"
description = "Gösterge ve panel okuma — akıllı fabrika devriye modülü (GÖSTERGE)"
requires-python = ">=3.10"

# src/ düzeni: paket src/gauge_vision altında durur.
# `pip install -e .` sonrası her yerden `import gauge_vision` çalışır
# (testler, notebook'lar, scriptler aynı importu kullanır — yol hilesi yok).
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
